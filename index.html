<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locamix — Orçamentos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--blue:#1537A8;--red:#D91414;--green:#2FB81A;--paper:#fff;--bg:#F1F3F6;--card:#fff;--border:#DDE2E8;--text:#1A212B;--muted:#66717E;--soft:#F7F8FA;--head:#fff;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--blue:#6C8CFF;--bg:#0E1218;--card:#171D26;--border:#2A3340;--text:#EDF1F6;--muted:#97A3B2;--soft:#1D2530;--head:#171D26}}
:root[data-theme="dark"]{color-scheme:dark;--blue:#6C8CFF;--bg:#0E1218;--card:#171D26;--border:#2A3340;--text:#EDF1F6;--muted:#97A3B2;--soft:#1D2530;--head:#171D26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:40}
.wrap{max-width:520px;margin:0 auto;padding-bottom:110px;overflow-x:hidden}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head);border-bottom:3px solid var(--green);padding:8px 14px;display:flex;align-items:center;gap:10px}
header .logo{background:#fff;border-radius:8px;padding:2px 6px;display:flex}
header img{height:38px;width:auto;display:block}
header .t{font-size:14px;font-weight:800;color:var(--blue);line-height:1.15}
header .t small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
#resetBtn{margin-left:auto;min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--soft);color:var(--text);font:600 13px var(--font)}
.card{background:var(--card);margin:12px 14px;border-radius:14px;border:1px solid var(--border);padding:16px}
.card h3{margin:0 0 12px;font-size:12.5px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;min-height:48px;padding:12px;border:1.5px solid var(--border);border-radius:10px;font:16px var(--font);color:var(--text);background:var(--card);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
details summary{font-size:13.5px;font-weight:700;color:var(--blue);padding:12px 0;cursor:pointer;list-style:none;min-height:44px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ "}details[open] summary::before{content:"– "}
.item{border:1.5px solid var(--border);background:var(--soft);border-radius:12px;padding:12px;margin-bottom:12px}
.item-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item-total{font-size:14px;font-weight:800;color:var(--blue)}
.rm{background:none;border:none;color:var(--red);font:700 13px var(--font);min-height:44px;padding:0 6px}
.add{width:100%;min-height:50px;border:2px dashed var(--blue);border-radius:12px;background:none;color:var(--blue);font:700 15px var(--font)}
.sum{display:flex;justify-content:space-between;font-size:14px;margin-top:12px;color:var(--muted)}
.sum b{color:var(--text)}
footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .l{flex:1;min-width:0}.bar .l span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.bar .l b{font-size:20px;color:var(--blue);white-space:nowrap}
#dl{min-height:52px;padding:0 22px;border:none;border-radius:12px;background:var(--red);color:#fff;font:800 15px var(--font)}
#dl:disabled{opacity:.6}
#msg{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#1A212B;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;display:none;z-index:50;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo"><img id="logo" alt="Locamix"></div>
  <div class="t">Orçamentos<small>Locação de Máquinas</small></div>
  <button id="resetBtn">Novo</button>
</header>
<div class="wrap" id="app"></div>
<div id="msg"></div>
<footer><div class="bar">
  <div class="l"><span>Total</span><b id="tot">R$ 0,00</b></div>
  <button id="dl">Baixar PDF</button>
</div></footer>

let S=fresh();
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.c&&o.items&&o.items.length)S=o}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const it$=i=>{const q=parseFloat(i.qtd),v=parseFloat(i.vu);return isNaN(q)||isNaN(v)?0:Math.round(q*v*100+1e-7)/100};
const sub=()=>Math.round(S.items.reduce((s,i)=>s+it$(i),0)*100)/100;
const disc=()=>Math.min(Math.max(parseFloat(S.desconto)||0,0),sub());
const total=()=>Math.round((sub()-disc())*100)/100;
function setPath(p,v){const a=p.split('.');let o=S;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
const inp=(p,l,t,ph,extra)=>`<div class="field"><label>${l}</label><input type="${t||'text'}" ${t==='number'?'inputmode="decimal" step="0.01"':''} data-f="${p}" value="${esc(p.split('.').reduce((o,k)=>o[k],S))}" placeholder="${ph||''}" ${extra||''}></div>`;

function render(){
const items=S.items.map((it,i)=>`<div class="item">
 <div class="field"><label>Maquinário / equipamento</label><input type="text" data-f="items.${i}.descricao" value="${esc(it.descricao)}" placeholder="Ex: Bobcat S650, retroescavadeira..." autocapitalize="sentences"></div>
 <div class="row2">
  <div class="field"><label>Quantidade</label><input type="number" inputmode="decimal" step="0.01" data-f="items.${i}.qtd" value="${it.qtd}"></div>
  <div class="field"><label>Período</label><select data-f="items.${i}.un">${UN.map(u=>`<option ${u===it.un?'selected':''}>${u}</option>`).join('')}</select></div>
 </div>
 <div class="field"><label>Valor por período (R$)</label><input type="number" inputmode="decimal" step="0.01" data-f="items.${i}.vu" value="${it.vu}"></div>
 <div class="item-foot"><span class="item-total">Total: ${brl(it$(it))}</span>${S.items.length>1?`<button class="rm" data-a="rm" data-i="${i}">Remover</button>`:''}</div>
</div>`).join('');
document.getElementById('app').innerHTML=`
<div class="card"><h3>Cliente</h3>
 ${inp('c.cliente','Nome do cliente / empresa')}
 <div class="row2">${inp('c.data','Data','date')}${inp('c.cidade','Cidade')}</div>
 ${inp('c.endereco','Endereço da obra')}
 ${inp('c.fone','Telefone do cliente','tel')}
 <details><summary>Mais dados do cliente</summary>${inp('c.doc','CNPJ / CPF')}</details>
</div>
<div class="card"><h3>Vendedor</h3><div class="row2">${inp('c.vendedor','Nome')}${inp('c.telV','Telefone','tel')}</div></div>
<div class="card"><h3>Maquinário</h3>${items}<button class="add" data-a="add">+ Adicionar maquinário</button>
 <div class="field" style="margin-top:14px"><label>Desconto (R$)</label><input type="number" inputmode="decimal" step="0.01" data-f="desconto" value="${S.desconto}" placeholder="0,00"></div>
 <div class="sum"><span>Subtotal</span><b id="sub">${brl(sub())}</b></div>
</div>
<div class="card"><h3>Condições da locação</h3>
 ${inp('periodo','Período da locação','text','Ex: 10 a 20/12 ou 5 dias')}
 <div class="field"><label>Operador</label><select data-f="operador">${['Sem operador','Com operador'].map(o=>`<option ${o===S.operador?'selected':''}>${o}</option>`).join('')}</select></div>
 ${inp('validade','Validade da proposta')}
 ${inp('pagamento','Forma de pagamento')}
 <div class="field"><label>Observações</label><textarea data-f="obs">${esc(S.obs)}</textarea></div>
 ${inp('responsavel','Responsável pela assinatura (Locamix)','text','Nome de quem assina')}
</div>`;
upd()}
function upd(){document.getElementById('tot').textContent=brl(total());const s=document.getElementById('sub');if(s)s.textContent=brl(sub())}

const app=document.getElementById('app');
app.addEventListener('input',e=>{
 const f=e.target.getAttribute('data-f');if(!f)return;
 let v=e.target.value;if(e.target.type==='number')v=v===''?'':parseFloat(v);
 setPath(f,v);
 const m=f.match(/^items\.(\d+)\./);
 if(m){const c=e.target.closest('.item');if(c)c.querySelector('.item-total').textContent='Total: '+brl(it$(S.items[+m[1]]))}
 upd();save()});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 if(b.dataset.a==='add'){S.items.push(mkItem('',1,'diária',0))}
 else if(b.dataset.a==='rm'){S.items.splice(+b.dataset.i,1)}
 save();render()});
document.getElementById('resetBtn').addEventListener('click',()=>{
 if(!confirm('Limpar todos os dados do orçamento?'))return;
 S=fresh();save();render();window.scrollTo(0,0)});

function toast(t){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3500)}

function gerarPDF(){
 const {jsPDF}=window.jspdf;const p=new jsPDF('p','mm','a4');
 const W=210,H=297,M=15,CW=W-M*2;let y=M;
 const BLUE=[21,55,168],RED=[217,20,20],MUT=[102,113,126],LIGHT=[245,246,248],BORD=[220,225,230],TX=[26,33,43];
 const need=h=>{if(y+h>H-M){p.addPage();y=M}};
 try{p.addImage(LOGO,'JPEG',M,y,44,22)}catch(e){}
 p.setFont('helvetica','bold');p.setFontSize(15);p.setTextColor(...BLUE);
 p.text('Orçamento de Locação',W-M,y+9,{align:'right'});
 p.setFont('helvetica','normal');p.setFontSize(9.5);p.setTextColor(...MUT);
 p.text('Locação de máquinas e equipamentos',W-M,y+15,{align:'right'});
 y+=26;p.setDrawColor(47,184,26);p.setLineWidth(1);p.line(M,y,W-M,y);y+=8;
 const c=S.c;
 const rows=[['Cliente',c.cliente||'—'],['Data',dateBR(c.data)],['Endereço da obra',c.endereco||'—'],['Cidade',c.cidade||'—'],['Telefone',c.fone||'—'],['CNPJ / CPF',c.doc||'—'],['Contato Locamix',[c.vendedor,c.telV].filter(Boolean).join(' — ')||'—'],['Período da locação',S.periodo||'—']];
 const cw=CW/2;p.setFontSize(9.5);
 for(let i=0;i<rows.length;i+=2){need(12);
  for(let k=0;k<2;k++){const r=rows[i+k];if(!r)continue;const x=M+k*cw;
   p.setFont('helvetica','normal');p.setTextColor(...MUT);p.text(r[0],x,y);
   p.setFont('helvetica','bold');p.setTextColor(...TX);p.text(p.splitTextToSize(String(r[1]),cw-4)[0],x,y+4.3)}
  y+=11}
 y+=3;need(16);
 p.setFont('helvetica','bold');p.setFontSize(10.5);p.setTextColor(...BLUE);p.text('Maquinário',M,y);y+=5;
 const cols=[['Equipamento',.40,'left'],['Qtd.',.10,'right'],['Período',.14,'right'],['Valor unit.',.17,'right'],['Total',.19,'right']].map(a=>({l:a[0],w:CW*a[1],a:a[2]}));
 const hdr=()=>{need(9);p.setFillColor(...BLUE);p.rect(M,y,CW,8,'F');p.setFont('helvetica','bold');p.setFontSize(8.5);p.setTextColor(255,255,255);
  let x=M;cols.forEach(k=>{p.text(k.l,k.a==='right'?x+k.w-2:x+2,y+5.4,{align:k.a});x+=k.w});y+=8};
 hdr();
 S.items.forEach((it,n)=>{
  const dl=p.splitTextToSize(it.descricao||'Equipamento não informado',cols[0].w-4);
  const rh=Math.max(dl.length*4.2+3,8);
  if(y+rh>H-M){p.addPage();y=M;hdr()}
  if(n%2){p.setFillColor(...LIGHT);p.rect(M,y,CW,rh,'F')}
  p.setDrawColor(...BORD);p.setLineWidth(.2);p.line(M,y+rh,M+CW,y+rh);
  p.setFont('helvetica','normal');p.setFontSize(9);p.setTextColor(...TX);
  let x=M;p.text(dl,x+2,y+5);x+=cols[0].w;
  const q=parseFloat(it.qtd);p.text(isNaN(q)?'—':q.toLocaleString('pt-BR'),x+cols[1].w-2,y+5,{align:'right'});x+=cols[1].w;
  p.text(String(it.un),x+cols[2].w-2,y+5,{align:'right'});x+=cols[2].w;
  p.text(brl(parseFloat(it.vu)||0),x+cols[3].w-2,y+5,{align:'right'});x+=cols[3].w;
  p.setFont('helvetica','bold');p.text(brl(it$(it)),x+cols[4].w-2,y+5,{align:'right'});
  y+=rh});
 y+=4;need(24);
 const d=disc();
 p.setDrawColor(...BLUE);p.setLineWidth(.6);p.line(M,y,W-M,y);y+=7;
 if(d>0){p.setFont('helvetica','normal');p.setFontSize(10);p.setTextColor(...MUT);p.text('Subtotal',W-M-40,y,{align:'right'});p.setTextColor(...TX);p.text(brl(sub()),W-M,y,{align:'right'});y+=6;
  p.setTextColor(...MUT);p.text('Desconto',W-M-40,y,{align:'right'});p.setTextColor(...TX);p.text('- '+brl(d),W-M,y,{align:'right'});y+=8}
 p.setFont('helvetica','normal');p.setFontSize(10);p.setTextColor(...MUT);p.text('Valor total',W-M-40,y,{align:'right'});
 p.setFont('helvetica','bold');p.setFontSize(14);p.setTextColor(...(d>0?RED:BLUE));p.text(brl(total()),W-M,y,{align:'right'});y+=11;
 // observações
 const ob=(S.obs||'').trim();
 if(ob){const ln=p.splitTextToSize(ob,CW-8);const bh=ln.length*4.6+6;need(bh+12);
  p.setFont('helvetica','bold');p.setFontSize(10.5);p.setTextColor(...BLUE);p.text('Observações',M,y);y+=5;
  p.setFillColor(...LIGHT);p.rect(M,y,CW,bh,'F');p.setDrawColor(...BLUE);p.setLineWidth(1.2);p.line(M,y,M,y+bh);
  p.setFont('helvetica','normal');p.setFontSize(9);p.setTextColor(...TX);p.text(ln,M+5,y+5.5);y+=bh+8}
 need(40);
 p.setDrawColor(...BORD);p.setLineWidth(.3);p.line(M,y,W-M,y);y+=7;
 const cw3=CW/3;
 [['Operador',S.operador],['Validade da proposta',S.validade||'—'],['Forma de pagamento',S.pagamento||'—']].forEach((k,i)=>{
  const x=M+i*cw3;p.setFont('helvetica','bold');p.setFontSize(8);p.setTextColor(...BLUE);p.text(k[0].toUpperCase(),x,y);
  p.setFont('helvetica','normal');p.setFontSize(9);p.setTextColor(...TX);p.text(p.splitTextToSize(k[1],cw3-5),x,y+5)});
 y+=28;need(16);
 const sw=CW/2-8;p.setDrawColor(...TX);p.setLineWidth(.3);
 p.line(M,y,M+sw,y);p.line(W-M-sw,y,W-M,y);y+=5;
 p.setFont('helvetica','normal');p.setFontSize(9);p.setTextColor(...TX);
 p.text(S.responsavel||'Responsável',M+sw/2,y,{align:'center'});
 p.text('Cliente / Contratante',W-M-sw/2,y,{align:'center'});
 const slug=(c.cliente||'cliente').trim().replace(/[^a-zA-Z0-9]+/g,'_');
 return {blob:p.output('blob'),name:`Orcamento_Locamix_${slug}_${(c.data||today()).replace(/-/g,'')}.pdf`,pdf:p};
}

document.getElementById('dl').addEventListener('click',async()=>{
 const b=document.getElementById('dl'),o=b.textContent;b.textContent='Gerando...';b.disabled=true;
 try{
  await new Promise(r=>setTimeout(r,30));
  const r=gerarPDF();
  let dls=null;try{dls=window.claude&&await claude.use('downloads')}catch(e){}
  if(dls){await dls.save({filename:r.name,data:r.blob});toast('PDF pronto!')}
  else{r.pdf.save(r.name)}
 }catch(err){if(!err||err.code!=='declined')toast('Não foi possível gerar o PDF.')}
 finally{b.textContent=o;b.disabled=false}
});
render();
</script>
</body>
</html>
